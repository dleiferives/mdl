[package]
name = "mdl-test"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[lib]
name = "mdl_test"

[[bin]]
name = "mdl-test"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
mdl-compiler = { path = "../mdl-compiler" }
